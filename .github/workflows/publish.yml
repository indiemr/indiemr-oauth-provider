name: Publish snapshot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Never let two deploys of the same snapshot run concurrently.
concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: Build and deploy to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # server-id matches <distributionManagement><snapshotRepository><id>github</id>.
      # This module resolves nothing from GitHub Packages, so one server entry is enough.
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Refuse to deploy a non-SNAPSHOT version
        run: |
          PROJECT_VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "project.version=$PROJECT_VERSION"
          case "$PROJECT_VERSION" in
            *-SNAPSHOT) ;;
            *) echo "::error::$PROJECT_VERSION is not a SNAPSHOT - releases come from a tag, not from main."; exit 1 ;;
          esac

      # deployAtEnd: without it, a failure part-way through the reactor leaves a partial publish.
      #
      # Snapshot retention: GitHub Packages keeps every timestamped build under the single
      # -SNAPSHOT version entry and offers no way to prune them (deleting the version would
      # remove the artifact entirely), so growth is accepted deliberately.
      - name: Deploy snapshot
        run: mvn -B --no-transfer-progress -DdeployAtEnd=true clean deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
