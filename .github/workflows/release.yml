name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Build and release to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # A tag must match the pom version exactly, otherwise "release 1.0.0" would publish
      # whatever the pom happens to say - including a -SNAPSHOT.
      - name: Compare git tag with Maven version
        run: |
          GIT_TAG=${GITHUB_REF#refs/tags/}
          PROJECT_VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "tag=$GIT_TAG project.version=$PROJECT_VERSION"
          if [ "$PROJECT_VERSION" != "$GIT_TAG" ]; then
            echo "::error::git tag ($GIT_TAG) does not match the Maven version ($PROJECT_VERSION)."
            exit 1
          fi

      - name: Deploy release
        run: mvn -B --no-transfer-progress -DdeployAtEnd=true clean deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
