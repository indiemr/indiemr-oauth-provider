name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # This module has no src/test/java - `verify` is a compile-and-assemble gate: it builds the
    # api and omod jars and fails on a malformed config.xml or liquibase.xml. The curl-based
    # tests/integration-test.sh needs a live OpenMRS and real Google OAuth, so it cannot run here.
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # javaCompilerVersion = 1.8 in the root pom.
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build
        run: mvn -B --no-transfer-progress clean verify
